services:
  - type: web
    name: motorist-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string in the Render dashboard
      - key: JWT_SECRET
        sync: false   # paste a long random secret in the Render dashboard
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_NAME
        value: Motorcycle Traffic Control System
    healthCheckPath: /login
